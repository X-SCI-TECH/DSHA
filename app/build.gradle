plugins {
    id 'com.android.application'
}

// 骨架阶段不内置 300MB 离线 rootfs。默认走「精简包」路径，只要求能编出可安装的 APK；
// 完整包（含 offline-rootfs.bin）由 CI 在 arm64 runner 上现场生成后放回 assets 即可，
// 打包逻辑与原版 protectOfflineBundle 一致，留待接回。
def slim = project.hasProperty('slim') || !file("src/main/assets/offline-rootfs.bin").exists()

android {
    namespace 'com.deepseekharness.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.dsh.client"
        minSdk 23
        targetSdk 34
        versionCode 107
        versionName "1.2.0-rc1"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // 线上发布签名 = DSHA-ACTUAL-PUBLISH-KEY-debug.keystore（alias androiddebugkey，
        // 证书 SHA-256 E7:E3:A3:1A:75:94:6F:26:69:19:4C:97:2B:3D:D0:C9:AE:A3:FC:7C:50:A8:B8:85:D2:DE:E7:10:B2:2A:53:F5）。
        // v1.1.7 起线上包都是这把 debug keystore 签的（历史原因，勿换），
        // Android 只允许同签名覆盖安装，换钥 = 逼用户卸载重装丢数据。
        // 另一把 DSHA-release.keystore 只签增量更新清单，绝不混用。
        // 用法：DSHA_KEYSTORE=/path/to/keystore（缺省时退回 AGP debug keystore，仅供本地调试）。
        publish {
            def ksPath = System.getenv("DSHA_KEYSTORE") ?: project.findProperty("dsha.keystore")
            if (ksPath != null && !ksPath.toString().isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("DSHA_KEYSTORE_PASSWORD")
                        ?: project.findProperty("dsha.keystore.password") ?: "android"
                keyAlias System.getenv("DSHA_KEY_ALIAS")
                        ?: project.findProperty("dsha.key.alias") ?: "androiddebugkey"
                keyPassword System.getenv("DSHA_KEY_PASSWORD")
                        ?: project.findProperty("dsha.key.password") ?: "android"
                println "签名：发布 keystore ${ksPath}（alias=${keyAlias}）"
            } else {
                println "⚠️ 签名：未配置 DSHA_KEYSTORE，退回 AGP debug keystore —— 仅供本地调试，不可覆盖正式版"
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.publish
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            excludes += ['**/x86/**', '**/x86_64/**', '**/armeabi/**', '**/armeabi-v7a/**']
        }
    }

    androidResources {
        // 'bin' 是离线 rootfs：aapt 会把 .tar.gz 静默解成 .tar，所以打包前改名 .bin，
        // 且必须 STORED（不 deflate）—— 否则打包多花几分钟、首启解压多 inflate 一整遍 159MB。
        noCompress += ['gz', 'xz', 'bin', 'ja', 'tar', 'whl']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // java.util.function / java.time 等 Java 8 API 在 API 23 上不存在，
        // 用 core library desugaring 回退（java.nio.file 不在 desugaring 范围，另行替换）。
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // 内置浏览器内核兜底：系统 WebView 过旧（Chrome<118）时前端 JS 崩，切 GeckoView。
    implementation 'org.mozilla.geckoview:geckoview-arm64-v8a:126.0.20240526221752'
    implementation 'dev.rikka.shizuku:api:12.2.0'
    implementation 'dev.rikka.shizuku:provider:12.2.0'
    // 真 PTY 终端：Termux 拆出的 terminal-view/terminal-emulator（Apache 2.0），
    // 自带 JNI PTY 层（openpty+fork/exec）。坐标是 JitPack 多模块真实 groupId
    // （com.termux.termux-app），不是 Wiki 上会 401 的 com.termux:terminal-view。
    implementation 'com.termux.termux-app:terminal-view:0.118.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    testImplementation 'junit:junit:4.13.2'
}
